# Garde-fous bloquants (ADR 0015).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typage, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: renard
          POSTGRES_PASSWORD: renard
          POSTGRES_DB: renard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U renard"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - name: Les migrations correspondent aux modèles
        run: uv run alembic check
      - run: uv run pytest
      - name: Le schéma OpenAPI du front est à jour
        run: uv run python -m app.openapi && git diff --exit-code ../front/src/api/openapi.json

  front:
    name: Front (lint, typage, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Les types de l'API sont à jour
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  navigateur:
    name: Navigateur (Playwright, vraie API)
    runs-on: ubuntu-latest
    needs: [api, front]
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: renard
          POSTGRES_PASSWORD: renard
          POSTGRES_DB: renard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U renard"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: api
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npx playwright install --with-deps chromium
        working-directory: front
      # Lance l'API (base renard_e2e) et le front, puis tous les tests de navigateur.
      - run: npm run test:e2e
        working-directory: front
