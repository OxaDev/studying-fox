# Le Renard Étudiant derrière le nginx de la machine (ADR 0031).
# `make nginx` affiche ce fichier rempli avec les valeurs de infra/.env.
# À placer dans le bloc « server { … } » HTTPS du domaine, puis : nginx -t && systemctl reload nginx

# Sans barre finale, on mène à la vitrine.
location = __CHEMIN_BASE__ {
    absolute_redirect off;
    return 301 __CHEMIN_BASE__/;
}

location __CHEMIN_BASE__/ {
    # La barre finale de proxy_pass enlève le préfixe : Caddy reçoit /api, /app, /medias…
    proxy_pass http://127.0.0.1:__PORT_HTTP__/;
    # Une redirection absolue de l'API retrouve le préfixe.
    proxy_redirect https://$host/ https://$host__CHEMIN_BASE__/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # nginx est le premier proxy : il remplace l'en-tête au lieu de le compléter. Sinon un
    # visiteur pourrait choisir l'adresse IP vue par la limitation des tentatives.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Imports de leçons : archives jusqu'à 20 Mo (api/app/imports/lecture.py).
    client_max_body_size 25m;

    # Le HSTS du domaine (et de ses sous-domaines) reste une décision de ce serveur nginx.
    proxy_hide_header Strict-Transport-Security;
}
