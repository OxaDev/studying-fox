# Production et test local de l'ensemble (ADR 0012).
# En développement, on ne lance que la base : `docker compose up -d db`.
# Sur un serveur, passer par le Makefile (`make aide`) : il lit la config dans infra/.env.
name: renard-etudiant

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: renard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renard}
      POSTGRES_DB: renard
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposé seulement en local, sur 5433 pour ne pas gêner un PostgreSQL déjà installé.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renard"]
      interval: 5s
      retries: 10

  api:
    build: ../api
    restart: unless-stopped
    environment:
      RENARD_ENVIRONNEMENT: ${RENARD_ENVIRONNEMENT:-prod}
      RENARD_DATABASE_URL: postgresql+asyncpg://renard:${POSTGRES_PASSWORD:-renard}@db:5432/renard
      # Adresse vue par les visiteurs. Son chemin (CHEMIN_BASE) préfixe les liens (ADR 0031).
      RENARD_URL_PUBLIQUE: https://${DOMAINE:-localhost}${CHEMIN_BASE:-}
      RENARD_DOSSIER_MEDIAS: /srv/medias
      # Confirmation de l'email : à activer avec un service d'envoi (ADR 0023).
      RENARD_VERIFICATION_EMAIL: ${RENARD_VERIFICATION_EMAIL:-false}
    volumes:
      # L'API écrit les images importées ; Caddy les sert en lecture seule.
      - medias:/srv/medias
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/sante/base')
      interval: 10s
      timeout: 5s
      # Laisse le temps aux migrations et au chargement des parcours validés.
      start_period: 60s
      retries: 5

  caddy:
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
      args:
        # Inscrit dans le build du front : changer CHEMIN_BASE demande de reconstruire.
        CHEMIN_BASE: ${CHEMIN_BASE:-}
    restart: unless-stopped
    environment:
      DOMAINE: ${DOMAINE:-localhost}
      CHEMIN_BASE: ${CHEMIN_BASE:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - medias:/srv/medias:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  medias:
